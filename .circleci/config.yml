version: 2.1
jobs:
 build:
  docker:
   - image: cimg/go:1.21
  steps:
   - checkout
   - setup_remote_docker

   - run:
      name: Setup environment
      command: |
       if [ ${CIRCLE_PROJECT_USERNAME} == 'Securing-DevOps' ]; then
         dr="securingdevops"
       else
         dr=$DOCKER_USER
       fi
       echo "export DOCKER_REPO=$dr" >> $BASH_ENV

   - restore_cache:
      keys:
        - go-mod-v1-{{ checksum "go.sum" }}
        - go-mod-v1-

   - run:
      name: Download dependencies
      command: go mod download

   - save_cache:
      key: go-mod-v1-{{ checksum "go.sum" }}
      paths:
        - /home/circleci/go/pkg/mod

   - run:
      name: Run tests
      command: go test -v -covermode=count ./...

   - run:
      name: Run vet
      command: go vet ./...

   - deploy:
       name: Build and push Docker image
       command: |
         if [ "${CIRCLE_BRANCH}" == "master" ]; then
           docker login -u ${DOCKER_USER} -p ${DOCKER_PASS}
           docker build -t ${DOCKER_REPO}/${CIRCLE_PROJECT_REPONAME}:latest .
           docker push ${DOCKER_REPO}/${CIRCLE_PROJECT_REPONAME}:latest
         fi
